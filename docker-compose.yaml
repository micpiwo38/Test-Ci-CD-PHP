services:
  php:
    build: .
    container_name: php_apache_8_5
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html

  # Images MySQL
  db:
    image: mysql:8.4.13
    container_name: MySQL_8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: damp_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - 3306:3306

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    environment:
      - PMA_HOST=db
    ports:
      - 8080:80
    depends_on:
      - db
